name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
      - name: Check shell syntax
        run: |
          for script in *.sh; do bash -n "$script"; done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - name: Windows platform tests
        run: python -m unittest discover -s tests -p test_platform_win_cuda.py -v
      - name: Installer lifecycle with fake COM and registry
        shell: powershell
        run: ./tests/windows/install.Tests.ps1
      - name: Check every PowerShell script
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_ }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
